[project]
name = "stellametrics"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "astrosearch42 PC-Fixe", email = "bertrandm04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy==7.0.1",
    "numpy==2.1.3",
    "pillow==11.3.0",
    "pyqt5==5.15.11",
    "pyqt5-qt5==5.15.2",
    "pyqtgraph==0.13.7",
    "skyfield==1.53",
]

[project.scripts]
stellametrics = "stellametrics.Stellametrics:main"

[dependency-groups]
build = [
    "pyinstaller>=6.11,<7",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
